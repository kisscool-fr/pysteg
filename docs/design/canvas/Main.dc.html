<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PySteg — Hide, ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#141518}
a{color:#7AAEFF}a:hover{color:#A6C8FF}
</style>
</helmet>
<div style="width: 440px; height: 900px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 22px; background: #141518; color: #ECEDEE; font-family: Inter, -apple-system, 'Segoe UI', Ubuntu, sans-serif; font-size: 14px;">

  <div style="display: flex; gap: 4px; padding: 4px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
    <button type="button" aria-pressed="true" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: #2B2F35; color: #ECEDEE; font: 600 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accentText}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Hide
    </button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: transparent; color: #A1A5AC; font: 500 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      Reveal
    </button>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #1F3A2C; color: #5FD39A; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      Cover image
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
      <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 6px; background: #2B2F35; color: #8A8F97; display: flex; align-items: center; justify-content: center;" aria-label="Image thumbnail placeholder" role="img">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">holiday.png</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A1A5AC;">
          <span style="padding: 1px 6px; border-radius: 4px; background: #23324A; color: #9CC2FF; font-weight: 600; font-size: 11px;">LSB</span>
          PNG · 1920 × 1080 · 2.4 MB
        </div>
      </div>
      <button type="button" aria-label="Remove image" style="width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: #A1A5AC; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="height: 6px; border-radius: 3px; background: #2B2F35; overflow: hidden;"><div style="width: 9%; height: 6px; background: {{accentText}};"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A1A5AC;"><span>Capacity</span><span>24 KB of 259 KB used</span></div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <label for="msg" style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #1F3A2C; color: #5FD39A; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      Message
    </label>
    <div style="display: flex; flex-direction: column; background: #25282D; border: 1px solid #3A3E45; border-radius: 10px;">
      <textarea id="msg" style="height: 104px; resize: none; box-sizing: border-box; padding: 10px 12px; border: none; background: transparent; color: #ECEDEE; font: 14px/1.45 Inter, sans-serif; outline: none;">Meet at the old harbour on Friday, 7 pm. Bring the second key — the first one was copied.</textarea>
      <div style="display: flex; justify-content: flex-end; padding: 0 12px 8px; font-size: 12px; color: #8A8F97;">88 characters</div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #1F3A2C; color: #5FD39A; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      Protection
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 500;">Encrypt with a shared secret</span>
          <span style="font-size: 12px; color: #A1A5AC;">AES-256-GCM · Argon2id</span>
        </div>
        <button type="button" role="switch" aria-checked="true" aria-label="Encrypt with a shared secret" style="width: 44px; height: 26px; flex-shrink: 0; padding: 3px; border: none; border-radius: 13px; background: {{accent}}; display: flex; justify-content: flex-end;"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF;"></span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="secret" style="font-size: 12px; color: #A1A5AC;">Shared secret</label>
        <div style="display: flex; align-items: center; height: 40px; background: #25282D; border: 1px solid #3A3E45; border-radius: 8px;">
          <input id="secret" type="password" value="harbour-key-2" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: none; background: transparent; color: #ECEDEE; font: 14px Inter, sans-serif; letter-spacing: 2px; outline: none;">
          <button type="button" aria-label="Show secret" style="width: 38px; height: 38px; border: none; background: transparent; color: #A1A5AC; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="confirm" style="font-size: 12px; color: #A1A5AC;">Confirm secret</label>
        <div style="display: flex; align-items: center; height: 40px; background: #25282D; border: 1px solid #3A3E45; border-radius: 8px;">
          <input id="confirm" type="password" value="harbour-key-2" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: none; background: transparent; color: #ECEDEE; font: 14px Inter, sans-serif; letter-spacing: 2px; outline: none;">
        </div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5FD39A;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
          13 characters · secrets match
        </div>
      </div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <label for="out" style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #2B2F35; color: #A1A5AC; display: flex; align-items: center; justify-content: center; font-size: 11px;">4</span>
      Save as
    </label>
    <div style="display: flex; gap: 8px;">
      <input id="out" type="text" value="~/Pictures/holiday_hidden.png" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; background: #25282D; border: 1px solid #3A3E45; border-radius: 8px; color: #ECEDEE; font: 13px Inter, sans-serif; outline: none;">
      <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #3A3E45; border-radius: 8px; background: #2B2F35; color: #ECEDEE; font: 500 13px Inter, sans-serif;">Change…</button>
    </div>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="height: 48px; border: none; border-radius: 10px; background: {{accent}}; color: #FFFFFF; font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Hide message
    </button>
    <div style="text-align: center; font-size: 12px; color: #8A8F97;">Ctrl + Enter · ⌘ + Return on macOS</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FDB","options":["#2F6FDB","#1E8A5A","#7C4DDB","#C2541E"]},"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2F6FDB';
    const tints = { '#2F6FDB': '#7AAEFF', '#1E8A5A': '#5FD39A', '#7C4DDB': '#B79BFF', '#C2541E': '#F29A6B' };
    return { accent, accentText: tints[accent] ?? accent };
  }
}
</script>
</body>
</html>
