<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PySteg — Hide done, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F5F7}
a{color:#1F56C2}a:hover{color:#153F92}
</style>
</helmet>
<div style="width: 440px; height: 900px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 22px; background: #F4F5F7; color: #17191C; font-family: Inter, -apple-system, 'Segoe UI', Ubuntu, sans-serif; font-size: 14px;">

  <div style="display: flex; gap: 4px; padding: 4px; background: #E6E8EC; border: 1px solid #DADDE2; border-radius: 10px;">
    <button type="button" aria-pressed="true" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: #FFFFFF; color: #17191C; font: 600 14px Inter, sans-serif; box-shadow: 0 1px 2px rgba(20,22,26,0.12);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Hide
    </button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: transparent; color: #5B616B; font: 500 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      Reveal
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center;">
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #E3F3EA; color: #1F8A56; display: flex; align-items: center; justify-content: center;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600;">Message hidden</h1>
      <p style="margin: 0; color: #5B616B; line-height: 1.5;">Encrypted with your shared secret and written into a new image. Send the secret through a different channel.</p>
    </div>

    <div style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 12px; background: #FFFFFF; border: 1px solid #DADDE2; border-radius: 10px; text-align: left;">
      <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 6px; background: #ECEEF1; color: #6B717B; display: flex; align-items: center; justify-content: center;" aria-label="Output image thumbnail placeholder" role="img">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">holiday_hidden.png</div>
        <div style="font-size: 12px; color: #5B616B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">~/Pictures · 2.6 MB</div>
      </div>
      <button type="button" aria-label="Copy file path" style="width: 36px; height: 36px; border: none; border-radius: 6px; background: transparent; color: #5B616B; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="14" height="14" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button>
    </div>

    <div style="width: 100%; display: flex; gap: 8px;">
      <button type="button" style="flex: 1; height: 44px; border: 1px solid #DADDE2; border-radius: 10px; background: #FFFFFF; color: #17191C; font: 500 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
        Show in Finder
      </button>
      <button type="button" style="flex: 1; height: 44px; border: 1px solid #DADDE2; border-radius: 10px; background: #FFFFFF; color: #17191C; font: 500 14px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        Test with Reveal
      </button>
    </div>
    <div style="font-size: 12px; color: #5B616B;">“Show in Explorer” on Windows, “Open folder” on Linux</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <button type="button" style="height: 48px; border: none; border-radius: 10px; background: #2563D9; color: #FFFFFF; font: 600 15px Inter, sans-serif;">Hide another message</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
