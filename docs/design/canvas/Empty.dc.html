<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PySteg — First launch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#141518}
a{color:#7AAEFF}a:hover{color:#A6C8FF}
</style>
</helmet>
<div style="width: 440px; height: 900px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 22px; background: #141518; color: #ECEDEE; font-family: Inter, -apple-system, 'Segoe UI', Ubuntu, sans-serif; font-size: 14px;">

  <div style="display: flex; gap: 4px; padding: 4px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
    <button type="button" aria-pressed="true" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: #2B2F35; color: #ECEDEE; font: 600 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7AAEFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Hide
    </button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: transparent; color: #A1A5AC; font: 500 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      Reveal
    </button>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #2B2F35; color: #A1A5AC; display: flex; align-items: center; justify-content: center; font-size: 11px;">1</span>
      Cover image
    </div>
    <div style="height: 196px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; border: 1.5px dashed #44484F; border-radius: 12px; background: #1A1C1F; text-align: center;">
      <span style="width: 44px; height: 44px; border-radius: 22px; background: #23324A; color: #9CC2FF; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" x2="12" y1="3" y2="15"></line></svg></span>
      <div style="font-weight: 600; font-size: 15px;">Drop an image here</div>
      <button type="button" style="height: 34px; padding: 0 14px; border: 1px solid #3A3E45; border-radius: 8px; background: #2B2F35; color: #ECEDEE; font: 500 13px Inter, sans-serif;">Browse…</button>
      <div style="font-size: 12px; color: #A1A5AC;">PNG, BMP (pixels) · JPEG, TIFF (metadata)</div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <label for="msg" style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #2B2F35; color: #A1A5AC; display: flex; align-items: center; justify-content: center; font-size: 11px;">2</span>
      Message
    </label>
    <div style="display: flex; flex-direction: column; background: #25282D; border: 1px solid #3A3E45; border-radius: 10px;">
      <textarea id="msg" placeholder="Type the message to hide…" style="height: 104px; resize: none; box-sizing: border-box; padding: 10px 12px; border: none; background: transparent; color: #ECEDEE; font: 14px/1.45 Inter, sans-serif; outline: none;"></textarea>
      <div style="display: flex; justify-content: flex-end; padding: 0 12px 8px; font-size: 12px; color: #8A8F97;">0 characters</div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #2B2F35; color: #A1A5AC; display: flex; align-items: center; justify-content: center; font-size: 11px;">3</span>
      Protection
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 500;">Encrypt with a shared secret</span>
          <span style="font-size: 12px; color: #A1A5AC;">AES-256-GCM · Argon2id</span>
        </div>
        <button type="button" role="switch" aria-checked="true" aria-label="Encrypt with a shared secret" style="width: 44px; height: 26px; flex-shrink: 0; padding: 3px; border: none; border-radius: 13px; background: #2F6FDB; display: flex; justify-content: flex-end;"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF;"></span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="secret" style="font-size: 12px; color: #A1A5AC;">Shared secret</label>
        <div style="display: flex; align-items: center; height: 40px; background: #25282D; border: 1px solid #3A3E45; border-radius: 8px;">
          <input id="secret" type="password" placeholder="At least 8 characters" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: none; background: transparent; color: #ECEDEE; font: 14px Inter, sans-serif; outline: none;">
          <button type="button" aria-label="Show secret" style="width: 38px; height: 38px; border: none; background: transparent; color: #A1A5AC; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="confirm" style="font-size: 12px; color: #A1A5AC;">Confirm secret</label>
        <div style="display: flex; align-items: center; height: 40px; background: #25282D; border: 1px solid #3A3E45; border-radius: 8px;">
          <input id="confirm" type="password" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: none; background: transparent; color: #ECEDEE; font: 14px Inter, sans-serif; outline: none;">
        </div>
      </div>
    </div>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px;">
    <button type="button" disabled style="height: 48px; border: none; border-radius: 10px; background: #2B2F35; color: #8A8F97; font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Hide message
    </button>
    <div style="text-align: center; font-size: 12px; color: #A1A5AC;">Add a cover image to continue</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
