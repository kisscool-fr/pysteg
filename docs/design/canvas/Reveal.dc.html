<x-dc>
<helmet>

<div style="width: 440px; height: 900px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 22px; background: #141518; color: #ECEDEE; font-family: Inter, -apple-system, 'Segoe UI', Ubuntu, sans-serif; font-size: 14px;">

  <div style="display: flex; gap: 4px; padding: 4px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
    <button type="button" aria-pressed="false" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: transparent; color: #A1A5AC; font: 500 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Hide
    </button>
    <button type="button" aria-pressed="true" style="flex: 1; height: 38px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 7px; background: #2B2F35; color: #ECEDEE; font: 600 14px Inter, sans-serif;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7AAEFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
      Reveal
    </button>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #1F3A2C; color: #5FD39A; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      Image with a hidden message
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
      <div style="width: 56px; height: 56px; flex-shrink: 0; border-radius: 6px; background: #2B2F35; color: #8A8F97; display: flex; align-items: center; justify-content: center;" aria-label="Image thumbnail placeholder" role="img">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">holiday_hidden.png</div>
        <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A1A5AC;">
          <span style="padding: 1px 6px; border-radius: 4px; background: #23324A; color: #9CC2FF; font-weight: 600; font-size: 11px;">LSB</span>
          PNG · 1920 × 1080 · 2.6 MB
        </div>
      </div>
      <button type="button" aria-label="Remove image" style="width: 32px; height: 32px; border: none; border-radius: 6px; background: transparent; color: #A1A5AC; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px;">
      <span style="width: 20px; height: 20px; border-radius: 10px; background: #1F3A2C; color: #5FD39A; display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      Protection
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; background: #1D1F23; border: 1px solid #2C2F34; border-radius: 10px;">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
        <span style="font-weight: 500;">Message is encrypted</span>
        <button type="button" role="switch" aria-checked="true" aria-label="Message is encrypted" style="width: 44px; height: 26px; flex-shrink: 0; padding: 3px; border: none; border-radius: 13px; background: #2F6FDB; display: flex; justify-content: flex-end;"><span style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF;"></span></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="secret" style="font-size: 12px; color: #A1A5AC;">Shared secret</label>
        <div style="display: flex; align-items: center; height: 40px; background: #25282D; border: 1px solid #3A3E45; border-radius: 8px;">
          <input id="secret" type="password" value="harbour-key-2" style="flex: 1; min-width: 0; height: 38px; padding: 0 12px; border: none; background: transparent; color: #ECEDEE; font: 14px Inter, sans-serif; letter-spacing: 2px; outline: none;">
          <button type="button" aria-label="Show secret" style="width: 38px; height: 38px; border: none; background: transparent; color: #A1A5AC; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
      </div>
    </div>
  </section>

  <button type="button" style="height: 48px; flex-shrink: 0; border: none; border-radius: 10px; background: #2F6FDB; color: #FFFFFF; font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
    Reveal message
  </button>

  <section aria-label="Revealed message" style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #16261E; border: 1px solid #24533A; border-radius: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <div role="status" style="display: flex; align-items: center; gap: 8px; color: #5FD39A; font-weight: 600; font-size: 13px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>
        Decrypted · 88 characters
      </div>
      <div style="display: flex; gap: 6px;">
        <button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2E5E45; border-radius: 7px; background: #1C3227; color: #D7F2E3; font: 500 12px Inter, sans-serif; display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="14" height="14" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          Copy
        </button>
        <button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2E5E45; border-radius: 7px; background: #1C3227; color: #D7F2E3; font: 500 12px Inter, sans-serif; display: flex; align-items: center; gap: 6px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
          Save .txt
        </button>
      </div>
    </div>
    <div style="flex: 1; padding: 12px; border-radius: 8px; background: #101A15; color: #ECEDEE; line-height: 1.5; white-space: pre-wrap;">Meet at the old harbour on Friday, 7 pm. Bring the second key — the first one was copied.</div>
  </section>
</div>
