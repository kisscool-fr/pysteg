name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  setup:
    name: setup
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # uv sync --locked also fails when uv.lock is out of date
      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          environment: save

  check:
    name: check
    needs: [setup]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          environment: restore

      - name: Ruff check (app)
        run: uv run ruff check ./app/

      - name: Ruff check (tests)
        run: uv run ruff check ./tests/

      - name: Ruff format
        run: uv run ruff format --check ./app/ ./tests/

      - name: Pyright
        run: uv run pyright ./app/ ./tests/ --threads 4

  test:
    name: test
    needs: [check]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          environment: restore

      # PyQt6 links against these even with the offscreen platform the GUI tests use.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Pytest
        run: uv run pytest
